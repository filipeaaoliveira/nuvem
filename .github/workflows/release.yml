name: Release

# Tag-driven: pushing v<semver> builds release binaries for every supported
# platform, attests their provenance, and publishes a GitHub Release. The tag
# is the release decision; nothing here bumps versions, edits changelogs or
# publishes to crates.io.
#
# A manual dispatch is the rehearsal of that: it builds, tests, smoke-tests and
# packages every target and then stops, so the parts of this file that only run
# under a tag can be proven green before a tag exists. Everything a dispatch
# skips is guarded by `github.event_name == 'push'` below.
#
# Every target is built natively on a GitHub-hosted runner of its own
# architecture, so the smoke test always executes the binary it ships. Each
# matrix entry names its runner. nuvem is Unix-only (POSIX process control),
# so there is no Windows leg.
"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # GitHub only offers this for workflow files that are on the default branch,
  # so the rehearsal is dispatchable once this has merged, not from a branch.
  workflow_dispatch:

# Least privilege per job, below: the build jobs sign attestations and never
# write to the repository; only the release job creates the release.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The oldest glibc the Linux binaries are linked against, and the ceiling the
  # check below enforces. 2.28 covers Pop!_OS 22.04, Debian 10 and RHEL 8; the
  # runner's own glibc would have made it 2.39.
  GLIBC_FLOOR: "2.28"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      # One platform failing must not cancel the others: their logs are what
      # tells a platform-specific failure from a general one.
      fail-fast: false
      matrix:
        # Each Linux entry carries the digests of the toolchain downloads for
        # its architecture; the macOS entries need no Zig and carry none. The
        # nextest build for macOS is a universal binary, one digest for both.
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            zig-archive: zig-x86_64-linux-0.16.0
            zig-sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            zigbuild-archive: cargo-zigbuild-x86_64-unknown-linux-musl
            zigbuild-sha256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b
            nextest-archive: cargo-nextest-0.9.144-x86_64-unknown-linux-gnu
            nextest-sha256: 8a4f726272b0a1c499bd87ca3978bfbb1a8c20bb08ccf075b9996e2081bd1e1e
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            zig-archive: zig-aarch64-linux-0.16.0
            zig-sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            # cargo-zigbuild publishes no musl build for arm64 Linux.
            zigbuild-archive: cargo-zigbuild-aarch64-unknown-linux-gnu
            zigbuild-sha256: 25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419
            nextest-archive: cargo-nextest-0.9.144-aarch64-unknown-linux-gnu
            nextest-sha256: 7fecfd431b810c05c589d800524286b8f80ce2fe9fb1fef05caf16d095cea407
          - target: aarch64-apple-darwin
            runs-on: macos-15
            nextest-archive: cargo-nextest-0.9.144-universal-apple-darwin
            nextest-sha256: 87472b2c3ee09154cadd34d168a5cdede478806810f095c3dc4dc499943da42e
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel
            nextest-archive: cargo-nextest-0.9.144-universal-apple-darwin
            nextest-sha256: 87472b2c3ee09154cadd34d168a5cdede478806810f095c3dc4dc499943da42e
    runs-on: ${{ matrix.runs-on }}
    # A cold run is three slow parts in a row: the Zig download on Linux, the
    # test suite, and an LTO release build of the whole dependency graph. The
    # build is the part that must not be cut off, so the ceiling covers all
    # three with room to spare.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain (via rust-toolchain.toml)
        run: rustup show

      # The tag is the release decision, so it has to agree with the version the
      # binary will report; a mismatch here is caught before anything is built
      # or published rather than discovered on the release page.
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nuvem") | .version')"
          if [ -z "$version" ]; then
            echo "::error::could not read the nuvem version out of Cargo.toml"; exit 1
          fi
          # Unguarded on purpose: a dispatch runs the read, which is what
          # proves `cargo metadata` and `jq` exist on this image, and stops
          # before the comparison, which has no tag to compare against.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "rehearsal: Cargo.toml reports $version, no tag to compare"; exit 0
          fi
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*|"v$version+"*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1 ;;
          esac

      # A binary linked against the runner's glibc requires GLIBC_2.39 and will
      # not start on Pop!_OS 22.04, Debian 12 or RHEL 9, which ship 2.35, 2.36
      # and 2.34. Zig's linker targets an explicit older glibc, and it brings
      # its own C toolchain, which aws-lc-sys needs to compile its C and
      # assembly through cmake for that older target.
      #
      # Both downloads are checked against a digest recorded here rather than
      # piped straight into tar. This is the compiler and linker that produce
      # the binary people download: fetching either over the wire and running
      # it unverified would put whatever the network returned into the release,
      # which is the same class of problem the release's own .sha256 exists to
      # answer for.
      - name: Install Zig and cargo-zigbuild
        if: runner.os == 'Linux'
        env:
          ZIG_VERSION: 0.16.0
          ZIG_ARCHIVE: ${{ matrix.zig-archive }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
          CARGO_ZIGBUILD_VERSION: 0.23.4
          CARGO_ZIGBUILD_ARCHIVE: ${{ matrix.zigbuild-archive }}
          CARGO_ZIGBUILD_SHA256: ${{ matrix.zigbuild-sha256 }}
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/zig"
          tmp="$(mktemp -d)"

          curl -LsSf -o "$tmp/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}.tar.xz"
          echo "${ZIG_SHA256}  $tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/zig.tar.xz" -C "$HOME/.local/zig" --strip-components=1

          curl -LsSf -o "$tmp/cargo-zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/${CARGO_ZIGBUILD_ARCHIVE}.tar.xz"
          echo "${CARGO_ZIGBUILD_SHA256}  $tmp/cargo-zigbuild.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/cargo-zigbuild.tar.xz" -C "$HOME/.local/bin" --strip-components=1 \
            "${CARGO_ZIGBUILD_ARCHIVE}/cargo-zigbuild"

          rm -rf "$tmp"
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show the build toolchain versions
        if: runner.os == 'Linux'
        run: |
          zig version
          # `cargo zigbuild --version` hands the flag to the subcommand, which
          # takes cargo build's arguments and not this one; the binary answers
          # it directly.
          cargo-zigbuild --version

      # A tag is not a review: the suite runs here so a release cannot ship a
      # tree that CI never saw green, on any of its platforms. nextest rather
      # than libtest, for the same per-process isolation every other gate
      # needs. Its download is verified like the build tools above.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.144
          NEXTEST_ARCHIVE: ${{ matrix.nextest-archive }}
          NEXTEST_SHA256: ${{ matrix.nextest-sha256 }}
        run: |
          tmp="$(mktemp -d)"
          curl -LsSf -o "$tmp/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/${NEXTEST_ARCHIVE}.tar.gz"
          echo "${NEXTEST_SHA256}  $tmp/nextest.tar.gz" | shasum -a 256 -c -
          tar -xzf "$tmp/nextest.tar.gz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          rm -rf "$tmp"
          cargo nextest --version
      - name: Run the test suite
        run: cargo nextest run --all --locked

      - name: Build release binary (Linux, against the glibc floor)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ env.GLIBC_FLOOR }}

      - name: Build release binary (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The flag is not the guarantee. A --target suffix that was ignored, or
      # a dependency that pulls in a newer symbol anyway, would ship a 2.39
      # binary behind a 2.28 promise in the README — and the failure lands on
      # whoever downloads it, at exec time, as "GLIBC_2.39 not found". So the
      # floor is read back off the binary itself. `grep -a` rather than
      # `strings`, which is binutils and not guaranteed on this image.
      - name: Check the glibc floor of the built binary
        if: runner.os == 'Linux'
        run: |
          BIN=target/${{ matrix.target }}/release/nuvem
          highest="$(grep -ao 'GLIBC_[0-9]\+\.[0-9]\+' "$BIN" | sed 's/GLIBC_//' | sort -uV | tail -1)"
          if [ -z "$highest" ]; then
            echo "::error::no GLIBC_ version symbols found in $BIN, so its floor cannot be read"; exit 1
          fi
          echo "highest glibc symbol required: $highest (ceiling ${GLIBC_FLOOR})"
          if [ "$(printf '%s\n%s\n' "$highest" "${GLIBC_FLOOR}" | sort -V | tail -1)" != "${GLIBC_FLOOR}" ]; then
            echo "::error::binary requires glibc $highest, above the ${GLIBC_FLOOR} floor this release promises"; exit 1
          fi

      # The suite never runs the shipped artifact: unit and integration tests
      # link the library, so argv parsing, the entrypoint, and exit codes ship
      # untested without this. Three assertions, all offline: `info` is the
      # one subcommand that works headless and proves the binary starts and
      # resolves paths; the TUI without a terminal must refuse fast with the
      # guard's message rather than garble the caller's pipe; an unknown flag
      # exits 2 (clap's usage error), which scripts are entitled to rely on.
      # `set +e` per probe because the error paths are the assertion, not a
      # step failure.
      - name: Smoke-test the built binary
        run: |
          set -u
          BIN=target/${{ matrix.target }}/release/nuvem

          "$BIN" info | grep -q "config:" || { echo "::error::'nuvem info' did not print the config path"; exit 1; }

          set +e
          "$BIN" --demo </dev/null >/dev/null 2>demo-stderr.txt
          DEMO_EXIT=$?
          set -e
          if [ "$DEMO_EXIT" -eq 0 ]; then
            echo "::error::'nuvem --demo' without a terminal must refuse, exited 0"; exit 1
          fi
          grep -q "interactive terminal" demo-stderr.txt || { echo "::error::the non-terminal refusal lost its message"; cat demo-stderr.txt; exit 1; }

          set +e
          "$BIN" --definitely-not-a-flag >/dev/null 2>&1
          FLAG_EXIT=$?
          set -e
          if [ "$FLAG_EXIT" -ne 2 ]; then
            echo "::error::an unknown flag must exit 2 (clap usage error), got $FLAG_EXIT"; exit 1
          fi

      # Binary + docs in a tarball named <name>-<target>.tar.gz, with a .sha256
      # sidecar whose relative path makes `shasum -a 256 -c` work from the
      # download dir.
      - name: Package archive
        run: |
          ARCHIVE="nuvem-${{ matrix.target }}.tar.gz"
          STAGE="$(mktemp -d)/nuvem-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/nuvem LICENSE README.md CHANGELOG.md "$STAGE"/
          tar -C "$(dirname "$STAGE")" -czf "$ARCHIVE" "$(basename "$STAGE")"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      # Two conditions, and each fails differently without the other. A
      # rehearsal's binaries are thrown away, so signing them would put
      # provenance in the store for artifacts no one can download. And GitHub
      # issues no attestation for a private user-owned repository: it answers
      # "Feature not available", which is an error, so a tag pushed to a
      # private fork would fail the build here and take the publish job down
      # with it.
      #
      # Written as a condition rather than continue-on-error on purpose: a
      # genuine signing failure on a public repository still fails the release.
      - name: Attest build provenance
        if: github.event_name == 'push' && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nuvem-${{ matrix.target }}.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            nuvem-${{ matrix.target }}.tar.gz
            nuvem-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    # Without this a dispatch would reach `gh release create` with a branch
    # name in GITHUB_REF_NAME and cut a release called `main`.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      # The image ships a GitHub CLI of its own, whose version moves with the
      # image. The tool that publishes a release must not change underneath
      # the repository without a commit saying so, so a pinned build is
      # fetched and checked against its digest, the same way ci.yml pins
      # shellcheck.
      - name: Ensure the GitHub CLI is present
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          curl -LsSf -o "$tmp/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  $tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gh.tar.gz" -C "$HOME/.local/bin" --strip-components=2 \
            "gh_${GH_VERSION}_linux_amd64/bin/gh"
          rm -rf "$tmp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show the GitHub CLI version
        run: gh --version

      # --verify-tag refuses to invent a release for a tag that vanished
      # between trigger and run; the release notes stay in CHANGELOG.md and
      # the autogenerated commit list rather than being duplicated here.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in a semver tag is a pre-release identifier: v1.2.0-rc.1
          # is a candidate for 1.2.0, not 1.2.0 itself. Unmarked, GitHub makes
          # whichever release is newest the repository's "Latest release" —
          # the one the releases page offers first and the one an install
          # script that asks for `latest` downloads — so an rc would be handed
          # to everyone who never reads a version number.
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
